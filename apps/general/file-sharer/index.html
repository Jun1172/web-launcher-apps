<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网极简快传</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; color: #333; }
        .card { background: #f5f5f7; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        #qrcode { margin: 15px auto; }
        .drop-zone { border: 2px dashed #007aff; border-radius: 8px; padding: 30px; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover, .drop-zone.dragover { background: #e8f2ff; border-color: #0056cc; }
        .file-list { text-align: left; margin-top: 15px; }
        .file-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .file-item a { color: #007aff; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>📁 局域网极简快传</h2>
    
    <div class="card">
        <p>用手机扫码，或浏览器访问：</p>
        <strong id="url-text">http://__LOCAL_IP__:__PORT__</strong>
        <canvas id="qrcode"></canvas>
    </div>

    <div class="card">
        <h3>📤 发送文件到本机</h3>
        <div class="drop-zone" id="dropZone">
            <p>点击选择文件 或 拖拽到此处</p>
            <input type="file" id="fileInput" class="hidden" multiple>
        </div>
        <p id="uploadStatus" style="color: #007aff; margin-top: 10px;"></p>
    </div>

    <div class="card">
        <h3>📥 本机已共享的文件</h3>
        <div class="file-list" id="fileList">加载中...</div>
    </div>

    <script>
        const baseUrl = `http://__LOCAL_IP__:__PORT__`;
        
        // 1. 生成二维码
        QRCode.toCanvas(document.getElementById('qrcode'), baseUrl, { width: 180 });

        // 2. 加载文件列表
        async function loadFiles() {
            const res = await fetch('/api/files');
            const files = await res.json();
            const container = document.getElementById('fileList');
            if (files.length === 0) {
                container.innerHTML = '<p style="color:#888">暂无文件</p>';
                return;
            }
            container.innerHTML = files.map(f => `
                <div class="file-item">
                    <span>${f.name} <small style="color:#888">(${(f.size/1024).toFixed(1)} KB)</small></span>
                    <a href="/${f.name}" download>下载</a>
                </div>
            `).join('');
        }
        loadFiles();

        // 3. 拖拽上传逻辑
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        async function handleFiles(files) {
            const status = document.getElementById('uploadStatus');
            for (const file of files) {
                status.textContent = `正在上传: ${file.name}...`;
                const arrayBuffer = await file.arrayBuffer();
                
                const res = await fetch(`/api/upload?filename=${encodeURIComponent(file.name)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: arrayBuffer
                });
                
                if (res.ok) {
                    status.textContent = `✅ ${file.name} 上传成功`;
                } else {
                    status.textContent = `❌ ${file.name} 上传失败`;
                }
            }
            setTimeout(() => { status.textContent = ''; loadFiles(); }, 1000);
        }
    </script>
</body>
</html>
