<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{ } JSON 工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #d3e6ff;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #0b2547 0%, #071531 45%, #040b1c 100%);
    display: flex; justify-content: center; padding: 4vh 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 {
    margin: 0; font-size: 24px; letter-spacing: 2px;
    color: #38e0ff; text-shadow: 0 0 18px rgba(56,224,255,.5);
  }
  header p { margin: 6px 0 0; color: #7d93b8; font-size: 13px; }

  .panel {
    background: rgba(16,32,64,.5); border: 1px solid rgba(90,160,255,.25);
    border-radius: 16px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
  }

  .editor {
    position: relative; border: 1px solid rgba(90,160,255,.3); border-radius: 10px;
    background: #060f22; overflow: hidden;
  }
  textarea {
    display: block; width: 100%; height: 300px; resize: vertical;
    background: transparent; color: #b8d4f0; border: 0; outline: none;
    padding: 12px 14px; font: 13px/1.55 Consolas, "Courier New", monospace;
    caret-color: #38e0ff;
  }
  textarea::placeholder { color: #48658f; }

  .actions { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button {
    padding: 9px 18px; border: 0; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #042036;
    background: linear-gradient(180deg,#38e0ff,#0ea5e9);
    box-shadow: 0 4px 12px rgba(56,224,255,.25);
    transition: filter .12s, transform .12s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.96); }
  button.green { background: linear-gradient(180deg,#34d399,#059669); color: #042020; }
  button.purple { background: linear-gradient(180deg,#a78bfa,#7c3aed); color: #150a33; }
  button.ghost { background: transparent; color: #7d93b8; border: 1px solid #2c4a78; box-shadow: none; }

  .stats { text-align: right; color: #5d7ba6; font-size: 12px; margin-bottom: 10px; font-variant-numeric: tabular-nums; }

  /* 状态区 */
  .status { min-height: 40px; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .status.ok {
    color: #34d399; background: rgba(6,78,59,.25); border: 1px solid rgba(52,211,153,.35);
  }
  .status.err {
    color: #ff9db2; background: rgba(90,10,30,.3); border: 1px solid rgba(255,92,122,.4);
  }
  .status.hidden { display: none; }
  .status .msg { font-weight: 600; }
  .status .loc { color: #ffd166; font-size: 13px; margin-top: 4px; }
  .status .snippet {
    margin-top: 8px; font: 13px/1.5 Consolas, "Courier New", monospace;
    background: rgba(0,0,0,.35); border-radius: 6px; padding: 8px 10px;
    white-space: pre-wrap; word-break: break-all; color: #d9b8ff;
  }
  .status .snippet .caret { color: #ff5c7a; }
  .tips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tips span {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: rgba(255,92,122,.14); color: #ff9db2; border: 1px solid rgba(255,92,122,.35);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{ } JSON 工具</h1>
    <p>校验 / 格式化 / 压缩，并给出精确的出错位置</p>
  </header>

  <div class="panel">
    <div class="editor">
      <textarea id="input" spellcheck="false" placeholder='在此粘贴 JSON，例如：{"name": "web-launcher", "version": 1.0}'></textarea>
    </div>

    <div class="actions">
      <button id="validateBtn">校验</button>
      <button id="formatBtn" class="green">格式化</button>
      <button id="compressBtn" class="purple">压缩</button>
      <button id="copyBtn" class="ghost">复制结果</button>
      <button id="clearBtn" class="ghost">清空</button>
    </div>

    <div class="stats" id="stats">字符 0 · 行 0</div>

    <div class="status hidden" id="status">
      <div class="msg" id="statusMsg"></div>
      <div class="loc" id="statusLoc"></div>
      <div class="snippet" id="statusSnippet"></div>
      <div class="tips" id="statusTips"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const inputEl = document.getElementById('input');
  const status = document.getElementById('status');
  const statusMsg = document.getElementById('statusMsg');
  const statusLoc = document.getElementById('statusLoc');
  const statusSnippet = document.getElementById('statusSnippet');
  const statusTips = document.getElementById('statusTips');
  const statsEl = document.getElementById('stats');

  function updateStats() {
    const t = inputEl.value;
    const lines = t ? t.split('\n').length : 0;
    statsEl.textContent = '字符 ' + t.length + ' · 行 ' + lines + ' · 字节 ' + new Blob([t]).size;
  }
  inputEl.addEventListener('input', updateStats);

  function showStatus(cls, msg, loc, snippet, tips) {
    status.className = 'status ' + cls;
    statusMsg.textContent = msg;
    statusLoc.textContent = loc || '';
    statusSnippet.textContent = snippet || '';
    statusSnippet.style.display = snippet ? '' : 'none';
    statusTips.innerHTML = '';
    (tips || []).forEach(t => {
      const s = document.createElement('span');
      s.textContent = t;
      statusTips.append(s);
    });
  }

  // 位置 → 行列
  function posToLineCol(text, pos) {
    let line = 1, col = 1;
    const n = Math.min(pos, text.length);
    for (let i = 0; i < n; i++) {
      if (text[i] === '\n') { line++; col = 1; } else col++;
    }
    return { line, col };
  }

  // 从解析错误里提取出错位置
  function extractPos(text, err) {
    let m = /line\s+(\d+)\s+column\s+(\d+)/i.exec(err.message);
    if (m) return { line: +m[1], col: +m[2] };
    m = /position\s+(\d+)/i.exec(err.message);
    if (m) return posToLineCol(text, +m[1]);
    return null;
  }

  // 常见错误提示
  function findTips(text) {
    const tips = [];
    if (/,\s*[}\]](?=\s*$|[,}])/.test(text)) tips.push('检测到尾逗号（最后一个元素后不能有 ,）');
    if (/[{,]\s*(?:true|false|null|[A-Za-z_$][\w$]*)\s*:/.test(text)) tips.push('存在未加双引号的键名，如 key 应写成 "key"');
    if (/'([^'\\]|\\.)*'/.test(text)) tips.push('存在单引号字符串，JSON 必须使用双引号');
    if (/\/\/|\/\*/.test(text)) tips.push('检测到注释，JSON 标准不支持注释');
    const opens = (text.match(/[{\[]/g) || []).length;
    const closes = (text.match(/[}\]]/g) || []).length;
    if (opens > closes) tips.push('花括号/方括号未闭合，缺 ' + (opens - closes) + ' 个 } 或 ]');
    if (closes > opens) tips.push('花括号/方括号多闭合了 ' + (closes - opens) + ' 个');
    if (/[{}]\s*[}\]]/.test(text)) tips.push('可能存在空的 { } 或 [ ]，请检查结构');
    return tips.slice(0, 4);
  }

  // 生成带 ^ 定位的出错行片段
  function buildSnippet(text, loc) {
    if (!loc) return '';
    const lines = text.split('\n');
    const idx = loc.line - 1;
    const lineText = lines[idx] || '';
    const caretCol = Math.min(loc.col, lineText.length + 1);
    return lineText + '\n' + ' '.repeat(Math.max(0, caretCol - 1)) + '^';
  }

  function parseOK() {
    try {
      JSON.parse(inputEl.value);
      return true;
    } catch (e) {
      handleError(e);
      return false;
    }
  }

  function handleError(err) {
    const text = inputEl.value;
    const loc = extractPos(text, err);
    const tips = findTips(text);
    let locTxt = '';
    if (loc) locTxt = '出错位置：第 ' + loc.line + ' 行，第 ' + loc.col + ' 列';
    else locTxt = '解析器信息：' + err.message;
    const snippet = loc ? buildSnippet(text, loc) : '';
    showStatus('err', '❌ JSON 格式错误：' + err.message, locTxt, snippet, tips);
  }

  function ok(msg) {
    showStatus('ok', '✅ ' + msg, '', '', []);
  }

  document.getElementById('validateBtn').addEventListener('click', () => {
    if (!inputEl.value.trim()) { ok('请先粘贴或输入 JSON 内容'); return; }
    parseOK() && ok('JSON 格式完全正确');
  });

  function transform(fn, doneMsg) {
    if (!inputEl.value.trim()) { ok('请先粘贴或输入 JSON 内容'); return; }
    const obj = JSON.parse(inputEl.value); // 抛错则走 handleError
    inputEl.value = fn(obj);
    updateStats();
    ok(doneMsg);
  }

  document.getElementById('formatBtn').addEventListener('click', () => {
    try { transform(o => JSON.stringify(o, null, 2), '校验通过，已格式化（2 空格缩进）'); }
    catch (e) { handleError(e); }
  });
  document.getElementById('compressBtn').addEventListener('click', () => {
    try { transform(o => JSON.stringify(o), '校验通过，已压缩为单行'); }
    catch (e) { handleError(e); }
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!inputEl.value) { ok('没有可复制的内容'); return; }
    try {
      await navigator.clipboard.writeText(inputEl.value);
      ok('已复制到剪贴板');
    } catch (e) {
      // 旧环境兜底
      const ta = document.createElement('textarea');
      ta.value = inputEl.value;
      document.body.append(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      ok('已复制到剪贴板');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    inputEl.value = '';
    status.classList.add('hidden');
    updateStats();
  });

  updateStats();
})();
</script>
</body>
</html>
