<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📦 推箱子</title><style>body{margin:0;background:#1c1917;color:#fed7aa;font:16px system-ui;text-align:center}main{margin:4vh auto;max-width:440px}.board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,400px);margin:auto}.cell{aspect-ratio:1;display:grid;place-items:center;font-size:clamp(18px,7vw,34px);background:#292524}.wall{background:#57534e}.goal{color:#fbbf24}.box{background:#b45309}.player{background:#0369a1;border-radius:50%}button{margin:12px 4px;padding:9px 16px;border:0;border-radius:7px;background:#ea580c;color:white}</style><main><h1>📦 经典推箱子</h1><div id="board" class="board"></div><p id="info">方向键移动 · Z 撤销</p><button onclick="reset()">重开</button><button onclick="next()">下一关</button></main><script>const maps=['########|# .    #|# $$@  #|#  .   #|########','########|# . $  #|#  $$@ #|#  .   #|########'];let level=0,grid,history;function reset(){grid=maps[level].split('|').map(r=>[...r]);history=[];render()}function find(ch){for(let r=0;r<grid.length;r++)for(let c=0;c<grid[r].length;c++)if(grid[r][c]===ch||grid[r][c]==='@')return[r,c]}function move(dr,dc){let[pR,pC]=find('@'),nr=pR+dr,nc=pC+dc;if(grid[nr][nc]==='#')return;let target=grid[nr][nc];if(target==='$'){let br=nr+dr,bc=nc+dc;if(!' .'.includes(grid[br][bc]))return;history.push(grid.map(r=>r.slice()));grid[br][bc]='$'}else history.push(grid.map(r=>r.slice()));grid[pR][pC]=' ';grid[nr][nc]='@';render();if(!grid.flat().includes('$'))info.textContent='过关！点击下一关'}function render(){board.innerHTML='';grid.forEach(row=>row.forEach(v=>{let d=document.createElement('div');d.className='cell '+({ '#':'wall','@':'player','$':'box','.':'goal'}[v]||'');d.textContent={ '#':'', '@':'●','$':'■','.':'◆'}[v]||'';board.append(d)}))}function next(){level=(level+1)%maps.length;reset()}addEventListener('keydown',e=>{let m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(e.key.toLowerCase()==='z'&&history.length)grid=history.pop();else if(m)move(...m);render()});reset()</script>
