<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📦 推箱子</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #e8e2d8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #3a2a1a 0%, #241a10 45%, #150f08 100%);
    display: flex; justify-content: center; padding: 4vh 16px;
  }
  .wrap { width: 100%; max-width: 460px; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: 2px;
    color: #fbbf24; text-shadow: 0 0 18px rgba(251,191,36,.5);
  }
  header p { margin: 6px 0 0; color: #a08a6a; font-size: 13px; }

  .panel {
    background: rgba(46,32,16,.55); border: 1px solid rgba(180,130,60,.25);
    border-radius: 18px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
  }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hud-item { text-align: center; }
  .hud-item b { display: block; font-size: 20px; color: #fbbf24; font-variant-numeric: tabular-nums; }
  .hud-item span { font-size: 11px; color: #a08a6a; }
  .hud-item .lvl { color: #67e8f9; }

  .board-box {
    position: relative; border-radius: 12px; padding: 8px;
    background: #171207; border: 1px solid rgba(180,130,60,.3);
    box-shadow: inset 0 0 24px rgba(0,0,0,.6);
  }
  .board { display: grid; width: min(88vw, 380px); margin: 0 auto; }
  .cell { aspect-ratio: 1; position: relative; }

  /* 地面 */
  .cell.floor { background: #221a0f; }
  .cell.floor:nth-child(odd) { background: #261d11; }

  /* 墙壁（砖块纹理） */
  .cell.wall {
    background:
      linear-gradient(335deg, rgba(0,0,0,.25) 23px, transparent 23px),
      linear-gradient(155deg, rgba(0,0,0,.25) 23px, transparent 23px),
      linear-gradient(335deg, rgba(0,0,0,.25) 23px, transparent 23px),
      linear-gradient(155deg, rgba(0,0,0,.25) 23px, transparent 23px),
      linear-gradient(180deg, #6b7280, #4b5563);
    background-size: 58px 58px;
    background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px, 0 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
  }

  /* 目标点（发光圆点） */
  .cell .goal-dot {
    position: absolute; inset: 0; display: grid; place-items: center;
  }
  .cell .goal-dot::before {
    content: ""; width: 34%; height: 34%; border-radius: 50%;
    border: 3px solid #fbbf24;
    box-shadow: 0 0 12px rgba(251,191,36,.55), inset 0 0 6px rgba(251,191,36,.4);
  }

  /* 箱子（木箱） */
  .cell .box {
    position: absolute; inset: 10%; border-radius: 10%;
    background: linear-gradient(180deg, #c07a3e, #8a5228);
    border: 3px solid #6b3d1c;
    box-shadow: inset 0 0 0 2px rgba(255,220,170,.25), 0 3px 8px rgba(0,0,0,.5);
  }
  .cell .box::before, .cell .box::after {
    content: ""; position: absolute; background: rgba(90,50,20,.55);
  }
  .cell .box::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
  .cell .box::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }
  .cell .box.done {
    background: linear-gradient(180deg, #34d399, #059669);
    border-color: #047857;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), 0 0 16px rgba(52,211,153,.6);
  }

  /* 玩家 */
  .cell .player {
    position: absolute; inset: 14%; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #7df3ff, #0ea5e9 55%, #0369a1);
    box-shadow: 0 0 14px rgba(56,224,255,.6), 0 3px 6px rgba(0,0,0,.5);
  }
  .cell .player::before, .cell .player::after {
    content: ""; position: absolute; top: 28%; width: 16%; height: 20%;
    background: #04213a; border-radius: 50%;
  }
  .cell .player::before { left: 24%; }
  .cell .player::after { right: 24%; }

  .hint { text-align: center; color: #a08a6a; font-size: 12px; margin-top: 12px; }
  .actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    padding: 9px 18px; border: 0; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #241a10;
    background: linear-gradient(180deg,#fbbf24,#f59e0b);
    box-shadow: 0 4px 12px rgba(251,191,36,.3);
    transition: filter .12s, transform .12s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.96); }
  button.ghost {
    background: transparent; color: #a08a6a; border: 1px solid #6b5a3a; box-shadow: none;
  }

  /* 过关浮层 */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    background: rgba(20,12,4,.85); backdrop-filter: blur(4px);
    border-radius: 12px; transition: opacity .3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: 28px; color: #34d399; text-shadow: 0 0 20px rgba(52,211,153,.6); letter-spacing: 3px; }
  .overlay p { margin: 0; color: #e8e2d8; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📦 经典推箱子</h1>
    <p>方向键 / WASD 移动 · Z 撤销</p>
  </header>

  <div class="panel">
    <div class="hud">
      <div class="hud-item"><b class="lvl" id="level">1 / 4</b><span>关卡</span></div>
      <div class="hud-item"><b id="steps">0</b><span>步数</span></div>
      <div class="hud-item"><b id="pushes">0</b><span>推箱</span></div>
    </div>

    <div class="board-box">
      <div id="board" class="board"></div>
      <div class="overlay hidden" id="overlay">
        <h2>🎉 过关！</h2>
        <p id="overInfo"></p>
        <div class="actions">
          <button id="nextBtn">下一关</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="resetBtn">重开</button>
      <button id="undoBtn" class="ghost">撤销 Z</button>
      <button id="prevBtn" class="ghost">上一关</button>
    </div>
    <div class="hint">把箱子推到黄色目标点，全部到位即可过关</div>
  </div>
</div>

<script>
(function () {
  const maps = [
    '########|# .    #|# $$@  #|#  .   #|########',
    '########|# . $  #|#  $$@ #|#  .   #|########',
    '######|#    #|#  . #|# @$ #|#    #|######',
    '########|#      #|# .  . #|# $@$  #|#      #|########'
  ];

  const board = document.getElementById('board');
  const levelEl = document.getElementById('level');
  const stepsEl = document.getElementById('steps');
  const pushesEl = document.getElementById('pushes');
  const overlay = document.getElementById('overlay');
  const overInfo = document.getElementById('overInfo');

  let level = 0, grid, goals, steps, pushes, history;

  function reset() {
    grid = maps[level].split('|').map(r => [...r]);
    goals = [];
    grid.forEach((row, r) => row.forEach((ch, c) => {
      if (ch === '.' || ch === '*' || ch === '+') goals.push(r + ',' + c);
    }));
    steps = 0; pushes = 0; history = [];
    overlay.classList.add('hidden');
    levelEl.textContent = (level + 1) + ' / ' + maps.length;
    updateHud();
    render();
  }

  function findPlayer() {
    for (let r = 0; r < grid.length; r++)
      for (let c = 0; c < grid[r].length; c++)
        if (grid[r][c] === '@' || grid[r][c] === '+') return [r, c];
  }

  function isGoal(r, c) { return goals.includes(r + ',' + c); }
  function isWalkable(v) { return v === ' ' || v === '.'; }

  function move(dr, dc) {
    const [pr, pc] = findPlayer();
    const nr = pr + dr, nc = pc + dc;
    if (grid[nr] === undefined || grid[nr][nc] === undefined || grid[nr][nc] === '#') return;
    let boxMoved = false;
    if (grid[nr][nc] === '$' || grid[nr][nc] === '*') {
      const br = nr + dr, bc = nc + dc;
      const bv = grid[br]?.[bc];
      if (!isWalkable(bv)) return;
      grid[br][bc] = isGoal(br, bc) ? '*' : '$';
      boxMoved = true;
    }
    history.push({ grid: grid.map(r => r.slice()), steps, pushes });
    grid[pr][pc] = isGoal(pr, pc) ? '.' : ' ';
    grid[nr][nc] = isGoal(nr, nc) ? '+' : '@';
    steps++;
    if (boxMoved) pushes++;
    updateHud();
    render();
    checkWin();
  }

  function undo() {
    if (!history.length) return;
    const snap = history.pop();
    grid = snap.grid;
    steps = snap.steps;
    pushes = snap.pushes;
    updateHud();
    render();
    overlay.classList.add('hidden');
  }

  function checkWin() {
    const allDone = grid.flat().every(v => v !== '$');
    if (allDone) {
      overInfo.textContent = '本关用了 ' + steps + ' 步，推箱 ' + pushes + ' 次';
      overlay.classList.remove('hidden');
    }
  }

  function updateHud() {
    stepsEl.textContent = steps;
    pushesEl.textContent = pushes;
  }

  function render() {
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + grid[0].length + ', 1fr)';
    grid.forEach((row, r) => row.forEach((v, c) => {
      const cell = document.createElement('div');
      cell.className = 'cell ' + (v === '#' ? 'wall' : 'floor');

      if (isGoal(r, c)) {
        const dot = document.createElement('div');
        dot.className = 'goal-dot';
        cell.append(dot);
      }

      if (v === '$' || v === '*') {
        const box = document.createElement('div');
        box.className = 'box' + (v === '*' ? ' done' : '');
        cell.append(box);
      } else if (v === '@' || v === '+') {
        const p = document.createElement('div');
        p.className = 'player';
        cell.append(p);
      }
      board.append(cell);
    }));
  }

  function next() { level = (level + 1) % maps.length; reset(); }
  function prev() { level = (level - 1 + maps.length) % maps.length; reset(); }

  const DIRS = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1], W: [-1, 0], S: [1, 0], A: [0, -1], D: [0, 1]
  };

  addEventListener('keydown', e => {
    if (e.key === 'z' || e.key === 'Z') { undo(); return; }
    const d = DIRS[e.key];
    if (d) { e.preventDefault(); move(d[0], d[1]); }
  });

  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);

  reset();
})();
</script>
</body>
</html>
