<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐾 电子宠物</title><style>body{margin:0;background:#1e1b4b;color:#f5d0fe;font:16px system-ui;text-align:center}main{max-width:500px;margin:6vh auto}.pet{font-size:130px;height:180px;animation:bob 1.8s infinite}@keyframes bob{50%{transform:translateY(-12px)}}.bar{height:16px;background:#312e81;border-radius:10px;margin:12px}.fill{height:100%;background:#e879f9;border-radius:10px}button{padding:11px 17px;margin:5px;border:0;border-radius:8px;background:#c026d3;color:#fff}</style><main><h1>🐾 我的电子宠物</h1><div class="pet" id="pet">🐱</div><h2 id="mood">等你陪伴</h2><p>饱食度</p><div class="bar"><div class="fill" id="food"></div></div><button onclick="feed()">🍎 喂食</button><button onclick="play()">✨ 抚摸</button><button onclick="clean()">🧹 清理</button></main><script>let state=JSON.parse(localStorage.pet||'{"food":70,"mood":"等你陪伴"}');function save(){localStorage.pet=JSON.stringify(state);food.style.width=state.food+'%';mood.textContent=state.mood}function feed(){state.food=Math.min(100,state.food+15);state.mood='好好吃，谢谢你！';pet.textContent='😺';save()}function play(){state.food=Math.max(0,state.food-5);state.mood='开心地跳起来！';pet.textContent='😸';save()}function clean(){state.mood='房间变干净啦';pet.textContent='🐱';save()}setInterval(()=>{state.food=Math.max(0,state.food-1);if(state.food<25)state.mood='我有点饿了…';save()},10000);save()</script>
