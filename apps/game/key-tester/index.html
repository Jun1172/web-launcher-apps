<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⌨️ 按键测试</title><style>body{margin:0;background:#052e16;color:#dcfce7;font:16px system-ui;text-align:center}main{max-width:650px;margin:8vh auto;padding:20px}.target{font-size:clamp(42px,12vw,88px);color:#4ade80;font-weight:800;margin:30px}.key{display:inline-flex;padding:14px 20px;margin:5px;border:1px solid #166534;border-radius:8px;background:#14532d}.hit{background:#22c55e;color:#052e16}button{padding:10px 18px;border:0;border-radius:8px;background:#16a34a;color:white}</style><main><h1>⌨️ 按键反应测试器</h1><p>请按下指定按键，测量响应时间</p><div class="target" id="target">准备</div><div id="keys"></div><p id="stats">正确 0 · 平均 -- ms</p><button onclick="newTest()">开始测试</button></main><script>const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '];let wanted,start,correct=0,total=0,sum=0;function label(k){return k===' '?'SPACE':k.replace('Arrow','').toUpperCase()}function newTest(){wanted=keys[Math.random()*keys.length|0];target.textContent=label(wanted);start=performance.now()}addEventListener('keydown',e=>{if(!wanted)return;if(e.key===wanted){let ms=Math.round(performance.now()-start);correct++;total++;sum+=ms;stats.textContent='正确 '+correct+' · 平均 '+Math.round(sum/total)+' ms';target.textContent='✓ '+ms+' ms';setTimeout(newTest,500)}else{target.textContent='✕ 应按 '+label(wanted);total++;setTimeout(newTest,700)}});keysEl=document.querySelector('#keys');keys.forEach(k=>keysEl.innerHTML+=`<span class="key">${label(k)}</span>`)</script>
