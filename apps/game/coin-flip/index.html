<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🪙 抛硬币</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07130d;color:#dcfce7;font-family:system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;text-align:center}.wrap{width:min(92vw,520px);padding:24px}h1{font-size:clamp(28px,8vw,46px);color:#86efac;margin:0 0 8px;text-shadow:0 0 20px #22c55e66}.sub{color:#86a391;font-size:13px;margin-bottom:20px}.coin-area{height:240px;display:grid;place-items:center;perspective:800px}.coin{width:150px;height:150px;position:relative;transform-style:preserve-3d}.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:64px;backface-visibility:hidden;border:8px solid #a16207;background:radial-gradient(circle at 35% 28%,#fde68a,#f59e0b 58%,#92400e);box-shadow:inset 0 0 0 4px #fef3c766,0 12px 30px #0008}.tail{transform:rotateY(180deg)}.coin.flipping{animation:flip 1s cubic-bezier(.25,.7,.45,1)}.coin.flipping.tail-result{animation-name:flip-tail}@keyframes flip{to{transform:rotateY(1800deg) translateY(-40px)}}@keyframes flip-tail{to{transform:rotateY(1980deg) translateY(-40px)}}#result{height:36px;font-size:22px;color:#facc15;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{padding:11px 6px;border:1px solid #166534;border-radius:10px;background:#052e16}.stat b{display:block;color:#bbf7d0;font-size:21px}.stat span{font-size:11px;color:#86a391}button{padding:12px 25px;border:0;border-radius:9px;background:#16a34a;color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px #16a34a44}button:active{transform:scale(.95)}.reset{margin-top:10px;padding:8px 14px;background:#14532d;font-size:12px}.tip{color:#527563;font-size:12px;margin-top:18px}</style></head><body><main class="wrap"><h1>🪙 抛硬币</h1><p class="sub">把选择交给概率，正面还是反面？</p><div class="coin-area"><div class="coin" id="coin"><div class="face head">正</div><div class="face tail">反</div></div></div><div id="result">准备抛掷</div><div class="stats"><div class="stat"><b id="heads">0</b><span>正面</span></div><div class="stat"><b id="tails">0</b><span>反面</span></div><div class="stat"><b id="total">0</b><span>总次数</span></div></div><button id="flip" onclick="flip()">抛一次</button><br><button class="reset" onclick="resetStats()">重置统计</button><p class="tip">点击按钮或按空格键</p></main><script>let heads=0,tails=0,busy=false;const $=id=>document.getElementById(id);function flip(){if(busy)return;busy=true;result.textContent='硬币飞行中…';coin.classList.remove('flipping','tail-result');void coin.offsetWidth;let isHead=Math.random()<.5;if(!isHead)coin.classList.add('tail-result');coin.classList.add('flipping');setTimeout(()=>{if(isHead)heads++;else tails++;result.textContent=isHead?'结果：正面':'结果：反面';headsEl.textContent=heads;tailsEl.textContent=tails;total.textContent=heads+tails;busy=false},1000)}function resetStats(){heads=tails=0;result.textContent='准备抛掷';headsEl.textContent=tailsEl.textContent=total.textContent='0'}const headsEl=$('heads'),tailsEl=$('tails');addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();flip()}})</script></body></html>
