<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏓 打砖块</title><style>body{margin:0;background:#042f2e;color:#ccfbf1;font:16px system-ui;text-align:center}main{max-width:520px;margin:4vh auto}canvas{width:min(94vw,480px);background:#0f766e;border:2px solid #5eead4}button{padding:9px 18px;background:#14b8a6;color:#042f2e;border:0;border-radius:8px;font-weight:bold}</style><main><h1>🏓 极简打砖块</h1><p>← → 控制挡板 · 空格发球</p><canvas id="c" width="480" height="560"></canvas><p id="info">按空格开始</p><button onclick="reset()">重开</button></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),info=document.querySelector('#info');let ball,pad,bricks,run,score;function reset(){pad=210;ball={x:240,y:500,dx:3,dy:-3};bricks=Array.from({length:4},(_,r)=>Array.from({length:8},(_,i)=>({x:10+i*59,y:35+r*25,on:1})));score=0;run=false;draw()}function start(){run=true;requestAnimationFrame(loop)}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pad=Math.max(0,pad-24);if(e.key==='ArrowRight')pad=Math.min(420,pad+24);if(e.key===' '&&!run)start()});function loop(){if(!run)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<6||ball.x>474)ball.dx*=-1;if(ball.y<6)ball.dy*=-1;if(ball.y>530&&ball.x>pad&&ball.x<pad+60)ball.dy=-Math.abs(ball.dy);if(ball.y>560){run=false;info.textContent='失误，得分 '+score}bricks.flat().forEach(b=>{if(b.on&&ball.x>b.x&&ball.x<b.x+52&&ball.y>b.y&&ball.y<b.y+18){b.on=0;ball.dy*=-1;score+=10}});if(bricks.flat().every(b=>!b.on)){run=false;info.textContent='清空！得分 '+score}draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,480,560);bricks.flat().forEach(b=>{if(b.on){x.fillStyle='#fbbf24';x.fillRect(b.x,b.y,52,18)}});x.fillStyle='#f0fdfa';x.fillRect(pad,535,60,10);x.beginPath();x.arc(ball.x,ball.y,7,0,7);x.fill()}</script>
