<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐦 像素鸟</title><style>body{margin:0;background:#172554;color:#e0f2fe;font:16px system-ui;text-align:center}main{margin:4vh auto;max-width:440px}canvas{width:min(92vw,400px);background:linear-gradient(#38bdf8,#bae6fd);border:3px solid #fbbf24}button{padding:10px 22px;border:0;border-radius:8px;background:#f59e0b;color:#fff;font-weight:bold}#msg{height:26px}</style><main><h1>🐦 一键像素鸟</h1><p>空格 / Enter / 点击屏幕起飞</p><canvas id="c" width="400" height="560"></canvas><div id="msg">点击开始</div><button onclick="start()">重开</button></main><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),msg=document.querySelector('#msg');let y,vy,pipes,score,running=false,last=0;function start(){y=260;vy=0;pipes=[];score=0;running=true;msg.textContent='分数 0';requestAnimationFrame(loop)}function flap(){if(!running)return start();vy=-7}addEventListener('keydown',e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();flap()}});c.onclick=flap;function loop(t){if(!running)return;let dt=Math.min(2,(t-last)/16||1);last=t;vy+=.35*dt;y+=vy*dt;if(!pipes.length||pipes[pipes.length-1].x<220)pipes.push({x:420,gap:150+Math.random()*210|0,passed:false});pipes.forEach(p=>p.x-=2.4*dt);pipes=pipes.filter(p=>p.x>-55);for(const p of pipes){if(!p.passed&&p.x<55){p.passed=true;score++;msg.textContent='分数 '+score}if(55>p.x&&20<p.x+54&&(y< p.gap-70||y+24>p.gap+70))return end()}if(y<0||y+24>560)return end();draw();requestAnimationFrame(loop)}function end(){running=false;msg.textContent='撞到了！得分 '+score+'，按空格再试'}function draw(){g.clearRect(0,0,400,560);g.fillStyle='#65a30d';pipes.forEach(p=>{g.fillRect(p.x,0,54,p.gap-70);g.fillRect(p.x,p.gap+70,54,560)});g.fillStyle='#facc15';g.fillRect(55,y,24,24);g.fillStyle='#1e293b';g.fillRect(72,y+5,4,4)}start()</script>
