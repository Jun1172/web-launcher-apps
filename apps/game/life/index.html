<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧬 生命游戏</title><style>body{margin:0;background:#020617;color:#bae6fd;font:16px system-ui;text-align:center}main{margin:3vh auto;max-width:700px}canvas{width:min(94vw,640px);background:#0f172a;border:1px solid #155e75;cursor:crosshair}button{padding:9px 15px;margin:4px;border:0;border-radius:7px;background:#0891b2;color:#ecfeff}</style><main><h1>🧬 康威生命游戏</h1><p>点击绘制细胞 · 空格暂停/继续</p><canvas id="c" width="640" height="480"></canvas><div><button onclick="randomize()">随机重置</button><button onclick="paused=!paused">暂停/继续</button><button onclick="clearAll()">清空</button></div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),W=80,H=60,s=8;let a,paused=false;function clearAll(){a=Array.from({length:H},()=>Array(W).fill(0))}function randomize(){a=Array.from({length:H},()=>Array.from({length:W},()=>Math.random()<.18?1:0))}function draw(){x.fillStyle='#0f172a';x.fillRect(0,0,640,480);x.fillStyle='#67e8f9';a.forEach((r,y)=>r.forEach((v,i)=>v&&x.fillRect(i*s,y*s,s-1,s-1)))}function step(){let b=Array.from({length:H},()=>Array(W).fill(0));for(let y=0;y<H;y++)for(let i=0;i<W;i++){let n=0;for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++)if(dx||dy)n+=a[(y+dy+H)%H][(i+dx+W)%W];b[y][i]=n===3||n===2&&a[y][i]?1:0}a=b}c.onclick=e=>{let r=c.getBoundingClientRect(),i=(e.clientX-r.left)*W/r.width|0,y=(e.clientY-r.top)*H/r.height|0;a[y][i]^=1};function loop(){if(!paused)step();draw();setTimeout(loop,100)}randomize();loop();addEventListener('keydown',e=>{if(e.key===' ')paused=!paused})</script>
