<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐍 贪吃蛇</title><style>body{margin:0;background:#07111f;color:#dbeafe;font:16px system-ui;text-align:center}main{max-width:440px;margin:5vh auto;padding:20px}h1{color:#67e8f9}.hud{display:flex;justify-content:space-between;margin:12px}canvas{width:min(90vw,400px);background:#0d1b2a;border:2px solid #164e63;image-rendering:pixelated}.keys{display:grid;grid-template-columns:repeat(3,60px);gap:6px;justify-content:center;margin:14px}.keys button,button{background:#164e63;color:#e0f2fe;border:0;border-radius:8px;padding:10px;font-size:18px}.keys button:nth-child(2){grid-column:2}.keys button:nth-child(3){grid-column:1}.keys button:nth-child(4){grid-column:3}#msg{height:24px;color:#fbbf24}</style><main><h1>🐍 极简贪吃蛇</h1><div class="hud"><span>分数 <b id="score">0</b></span><button onclick="reset()">重开</button></div><canvas id="c" width="400" height="400"></canvas><div id="msg">方向键 / WASD 控制</div><div class="keys"><button data-d="U">↑</button><button data-d="L">←</button><button data-d="D">↓</button><button data-d="R">→</button></div></main><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),n=20,s=20;let snake,food,dir,next,score,over;function reset(){snake=[[10,10],[9,10],[8,10]];food=[15,10];dir=next='R';score=0;over=false;msg.textContent='方向键 / WASD 控制';tick()}function place(){do food=[Math.random()*n|0,Math.random()*n|0];while(snake.some(p=>p[0]===food[0]&&p[1]===food[1]))}function tick(){if(over)return;snake.unshift([snake[0][0]+({L:-1,R:1}[next]||0),snake[0][1]+({U:-1,D:1}[next]||0)]);dir=next;let h=snake[0];if(h[0]<0||h[0]>=n||h[1]<0||h[1]>=n||snake.slice(1).some(p=>p[0]===h[0]&&p[1]===h[1]))return end();if(h[0]===food[0]&&h[1]===food[1]){score++;scoreEl.textContent=score;place()}else snake.pop();draw();setTimeout(tick,110)}function end(){over=true;msg.textContent='游戏结束，点击“重开”再来一局';draw()}function draw(){x.fillStyle='#0d1b2a';x.fillRect(0,0,400,400);x.fillStyle='#fbbf24';x.fillRect(food[0]*s,food[1]*s,s,s);snake.forEach((p,i)=>{x.fillStyle=i?'#22c55e':'#a7f3d0';x.fillRect(p[0]*s+1,p[1]*s+1,s-2,s-2)})}const scoreEl=document.querySelector('#score'),msg=document.querySelector('#msg');addEventListener('keydown',e=>{let m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'}[e.key];if(m&&!({U:'D',D:'U',L:'R',R:'L'}[dir]===m))next=m});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let m=b.dataset.d;if({U:'D',D:'U',L:'R',R:'L'}[dir]!==m)next=m});reset()</script>
