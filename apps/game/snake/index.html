<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🐍 贪吃蛇</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #d3e4ff;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #07203f 0%, #06101f 45%, #030812 100%);
    display: flex; justify-content: center; padding: 4vh 16px;
  }
  .wrap { width: 100%; max-width: 470px; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 {
    margin: 0; font-size: 26px; letter-spacing: 2px;
    color: #5ff0c6; text-shadow: 0 0 18px rgba(52,224,138,.55);
  }
  header p { margin: 6px 0 0; color: #7d8db3; font-size: 13px; }

  .panel {
    background: rgba(14,28,52,.55); border: 1px solid rgba(90,200,170,.22);
    border-radius: 18px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.5);
    backdrop-filter: blur(8px);
  }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .hud-item { text-align: center; }
  .hud-item b { display: block; font-size: 22px; color: #5ff0c6; font-variant-numeric: tabular-nums; }
  .hud-item span { font-size: 11px; color: #7d8db3; }
  .hud-item.best b { color: #fbbf24; }

  .canvas-box {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(90,200,170,.3);
    box-shadow: inset 0 0 30px rgba(0,0,0,.5);
  }
  canvas { display: block; width: 100%; height: auto; background: #04101f; }

  /* 游戏结束浮层 */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    background: rgba(2,8,18,.82); backdrop-filter: blur(4px);
    transition: opacity .3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: 30px; color: #ff5c7a; text-shadow: 0 0 22px rgba(255,92,122,.6); letter-spacing: 4px; }
  .overlay .final-score { font-size: 18px; color: #d3e4ff; }
  .overlay .final-best { font-size: 14px; color: #fbbf24; }
  button {
    margin-top: 14px; padding: 11px 30px; border: 0; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #04101f;
    background: linear-gradient(180deg,#5ff0c6,#10b981);
    box-shadow: 0 4px 16px rgba(52,224,138,.35);
    transition: filter .12s, transform .12s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }

  /* 虚拟方向键 */
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 52px); gap: 8px; justify-content: center; margin-top: 16px; }
  .dpad button {
    margin: 0; padding: 0; border-radius: 10px; font-size: 20px;
    background: rgba(16,32,60,.7); color: #5ff0c6; border: 1px solid rgba(90,200,170,.3);
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .dpad button:nth-child(1) { grid-column: 2; grid-row: 1; }
  .dpad button:nth-child(2) { grid-column: 1; grid-row: 2; }
  .dpad button:nth-child(3) { grid-column: 2; grid-row: 2; }
  .dpad button:nth-child(4) { grid-column: 3; grid-row: 2; }
  .hint { text-align: center; color: #5d6f97; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐍 霓虹贪吃蛇</h1>
    <p>方向键 / WASD 或屏幕方向按钮控制</p>
  </header>

  <div class="panel">
    <div class="hud">
      <div class="hud-item"><b id="score">0</b><span>分数</span></div>
      <div class="hud-item best"><b id="best">0</b><span>最佳</span></div>
    </div>

    <div class="canvas-box">
      <canvas id="c" width="400" height="400"></canvas>
      <div class="overlay hidden" id="overlay">
        <h2>游戏结束</h2>
        <div class="final-score" id="finalScore"></div>
        <div class="final-best" id="finalBest"></div>
        <button id="retryBtn">再来一局</button>
      </div>
    </div>

    <div class="dpad">
      <button data-d="U">▲</button>
      <button data-d="L">◀</button>
      <button data-d="D">▼</button>
      <button data-d="R">▶</button>
    </div>
    <div class="hint">每吃一个食物速度提升 · 空格键暂停</div>
  </div>
</div>

<script>
(function () {
  // roundRect 兼容性兜底（老内核不支持）
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const N = 20, S = canvas.width / N;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');

  let snake, food, dir, next, score, over, paused, loop = null;
  let best = +(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function speed() { return Math.max(60, 110 - score * 2); }

  function reset() {
    snake = [[10, 10], [9, 10], [8, 10]];
    dir = next = 'R';
    score = 0; over = false; paused = false;
    scoreEl.textContent = 0;
    overlay.classList.add('hidden');
    placeFood();
    startLoop();
    draw();
  }

  function startLoop() {
    clearInterval(loop);
    loop = setInterval(tick, speed());
  }

  function placeFood() {
    do {
      food = [Math.random() * N | 0, Math.random() * N | 0];
    } while (snake.some(p => p[0] === food[0] && p[1] === food[1]));
  }

  const V = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const OPP = { U: 'D', D: 'U', L: 'R', R: 'L' };

  function setDir(m) {
    if (m && OPP[dir] !== m && !over && !paused) next = m;
  }

  function tick() {
    if (over || paused) return;
    dir = next;
    const [dx, dy] = V[dir];
    const head = [snake[0][0] + dx, snake[0][1] + dy];

    if (head[0] < 0 || head[0] >= N || head[1] < 0 || head[1] >= N ||
        snake.some(p => p[0] === head[0] && p[1] === head[1])) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (head[0] === food[0] && head[1] === food[1]) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; localStorage.setItem('snakeBest', best); bestEl.textContent = best; }
      placeFood();
      startLoop();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    over = true;
    clearInterval(loop);
    finalScore.textContent = '本局得分：' + score;
    finalBest.textContent = '历史最佳：' + best;
    overlay.classList.remove('hidden');
    draw();
  }

  // 绘制
  function glow(color, x, y, w, h, r, blur) {
    ctx.shadowColor = color; ctx.shadowBlur = blur;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function draw() {
    // 背景 + 网格
    ctx.fillStyle = '#04101f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(80,200,170,.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < N; i++) {
      ctx.moveTo(i * S, 0); ctx.lineTo(i * S, canvas.height);
      ctx.moveTo(0, i * S); ctx.lineTo(canvas.width, i * S);
    }
    ctx.stroke();

    // 食物（发光圆点 + 光晕脉动）
    const pulse = 4 + Math.sin(performance.now() / 200) * 2;
    glow('#ff5c7a', food[0] * S + S / 2 - 5, food[1] * S + S / 2 - 5, 10, 10, 5, pulse * 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd3dc';
    ctx.beginPath();
    ctx.arc(food[0] * S + S / 2, food[1] * S + S / 2, 4, 0, Math.PI * 2);
    ctx.fill();

    // 蛇：头亮尾暗的渐变霓虹
    const len = snake.length;
    snake.forEach((p, i) => {
      const t = i / len;
      const r = S * 0.36;
      const x = p[0] * S + S / 2, y = p[1] * S + S / 2;
      const c = i === 0 ? '#b8ffe9'
        : `hsl(${155 - t * 60}, 95%, ${62 - t * 22}%)`;
      glow(c, x - r, y - r, r * 2, r * 2, r, i === 0 ? 14 : 8);
      ctx.shadowBlur = 0;
      ctx.fillStyle = i === 0 ? '#d9fff1' : c;
      ctx.beginPath();
      ctx.arc(x, y, r - 1.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  document.getElementById('retryBtn').addEventListener('click', reset);

  // 键盘控制
  addEventListener('keydown', e => {
    const map = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R' };
    const m = map[e.key.toLowerCase()];
    if (m) { e.preventDefault(); setDir(m); }
    if (e.key === ' ') { e.preventDefault(); paused = !paused; }
  });

  document.querySelectorAll('.dpad button').forEach(b =>
    b.addEventListener('click', () => setDir(b.dataset.d))
  );

  reset();
})();
</script>
</body>
</html>
