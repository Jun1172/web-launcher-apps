<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🪵 赛博电子木鱼</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b16;color:#fef3c7;font-family:system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(245,158,11,.08),transparent 65%),repeating-linear-gradient(90deg,rgba(251,191,36,.025) 0 1px,transparent 1px 42px);pointer-events:none}.wrap{position:relative;width:min(92vw,520px);text-align:center;padding:24px}h1{margin:0;color:#fbbf24;font-size:clamp(25px,7vw,42px);text-shadow:0 0 18px #f59e0b88}.sub{color:#a8a29e;font-size:13px;margin:8px 0 20px}.stats{display:flex;justify-content:center;gap:10px;margin:14px 0}.stat{min-width:105px;padding:10px 14px;border:1px solid #78350f;border-radius:12px;background:#1c1917aa}.stat b{display:block;color:#fbbf24;font-size:22px}.stat span{font-size:11px;color:#a8a29e}.gong{position:relative;margin:20px auto;width:min(76vw,330px);height:min(54vw,230px);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.gong:active .wood{transform:scale(.94) rotate(-2deg)}.wood{width:80%;height:62%;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#f59e0b,#78350f 72%);border:8px solid #451a03;box-shadow:inset 12px 8px 22px #fde68a66,inset -18px -14px 20px #431407,0 0 0 5px #f59e0b22,0 18px 40px #000;transition:transform .12s}.wood:before{content:"";position:absolute;width:45%;height:18%;border-radius:50%;background:#451a03;box-shadow:inset 0 3px 5px #000;opacity:.7}.stick{position:absolute;width:72%;height:13px;background:#fca5a5;border:3px solid #7f1d1d;border-radius:10px;transform:rotate(-20deg);top:18%;right:4%;box-shadow:0 0 12px #fb7181}.merit{height:30px;color:#fcd34d;font-size:17px}.float{position:absolute;color:#fde68a;font-weight:800;pointer-events:none;animation:up 900ms ease-out forwards}@keyframes up{to{transform:translateY(-90px);opacity:0}}button{border:1px solid #a16207;background:#451a03;color:#fef3c7;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer}button:hover{background:#713f12}.tip{color:#78716c;font-size:12px;margin-top:16px}</style></head><body><main class="wrap"><h1>🪵 赛博电子木鱼</h1><p class="sub">敲一下，功德 +1 · 让内心获得片刻安静</p><div class="stats"><div class="stat"><b id="merit">0</b><span>今日功德</span></div><div class="stat"><b id="combo">0</b><span>当前连击</span></div><div class="stat"><b id="best">0</b><span>最高连击</span></div></div><div class="gong" id="gong" aria-label="点击敲木鱼"><div class="stick"></div><div class="wood"></div></div><div class="merit" id="message">等待你的敲击</div><button onclick="resetStats()">清除今日功德</button><p class="tip">点击木鱼 / 空格 / Enter</p></main><script>let merit=+(localStorage.cyberMerit||0),combo=0,best=+(localStorage.cyberBest||0),last=0;const $=id=>document.getElementById(id);function draw(){ $('merit').textContent=merit; $('combo').textContent=combo; $('best').textContent=best; }function hit(e){if(e&&e.type==='keydown'&&![' ','Enter'].includes(e.key))return;if(e)e.preventDefault();let now=Date.now();combo=now-last<1300?combo+1:1;last=now;merit++;if(combo>best){best=combo;localStorage.cyberBest=best}localStorage.cyberMerit=merit;message.textContent=combo>5?'功德无量！':'功德 +1';let f=document.createElement('span');f.className='float';f.textContent='+1 功德';f.style.left=(40+Math.random()*25)+'%';f.style.top='45%';gong.append(f);setTimeout(()=>f.remove(),900);draw()}function resetStats(){merit=0;combo=0;localStorage.cyberMerit=0;message.textContent='功德已清零';draw()}gong.onclick=hit;addEventListener('keydown',hit);draw()</script></body></html>
